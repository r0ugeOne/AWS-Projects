[project]
name = "aws-projects"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.17",
    "dotenv>=0.9.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyspark>=4.1.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]